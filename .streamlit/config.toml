# Tema do painel (lido quando o Streamlit roda a partir da raiz do
# projeto, como em iniciar_dashboard.bat). Cor principal = o azul
# dos gráficos, em vez do vermelho padrão (que soa como alerta).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f8f7fb"
secondaryBackgroundColor = "#efedf5"
textColor = "#292541"

# Site unico (app.py): abas MAPA e CENTRAL DE INFORMACOES. As paginas do MISM2 usam a barra delas, sem o menu automatico.
[client]
showSidebarNavigation = false
